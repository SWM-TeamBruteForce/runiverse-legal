<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runiverse — 약관 및 정책</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --accent:#2563eb; --box:#f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --line:#2e3237; --accent:#7aa2f7; --box:#1e2126; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 18px 80px; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:.9rem; margin-bottom:32px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--box);
    border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:12px 0; }
  a.card strong { display:block; font-size:1.05rem; color:var(--accent); margin-bottom:4px; }
  a.card span { color:var(--muted); font-size:.93rem; }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem; }
  code { background:var(--box); padding:2px 6px; border-radius:4px; font-size:.92em; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Runiverse</h1>
  <p class="meta">Google Play 개발자명: Team Bruteforce</p>

  <a class="card" href="./privacy.html">
    <strong>개인정보처리방침</strong>
    <span>수집하는 정보, 이용 목적, 보유 기간</span>
  </a>

  <a class="card" href="./account-deletion.html">
    <strong>계정 및 데이터 삭제</strong>
    <span>탈퇴 방법과 삭제·보관되는 데이터</span>
  </a>

  <a class="card" href="./archive/">
    <strong>이전 개인정보처리방침</strong>
    <span>개정 전 방침의 전문</span>
  </a>

  <footer>
    <p>문의: <code>somabruteforce@gmail.com</code></p>
  </footer>
</main>
</body>
</html>
